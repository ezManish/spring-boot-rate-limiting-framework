name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-unit:
    name: Build & Unit Tests (Java 21)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and run Unit Tests
        run: mvn -B verify -DskipITs

  integration:
    name: Integration Tests (Redis ${{ matrix.redis }})
    needs: build-unit
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        redis: ["6.2", "7", "8"]
    env:
      TC_REDIS_IMAGE: "redis:${{ matrix.redis }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Integration Tests with Testcontainers
        run: mvn -B verify -Pintegration
